spring.application.name=erp-demo
server.port=8090
spring.config.import=optional:file:/etc/erp.properties
spring.datasource.url=jdbc:oracle:thin:@//DB_HOST:51521/XEPDB1
spring.datasource.username=erp
spring.datasource.password=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
spring.thymeleaf.cache=false
erp.ai.base-url=http://127.0.0.1:8000
erp.internal.token=
erp.warehouse.capacity-pallets=82
erp.warehouse.operating-cap=0.8
erp.inbound.tolerance=0.10

# 로그인 세션 쿠키: 다른 사이트에서 보낸 POST에는 쿠키를 안 붙임 (CSRF 완화)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 초기 계정 비밀번호 (/etc/erp.properties 에서 지정, 비어 있으면 임의 생성 후 로그에 출력)
erp.seed.admin-password=
erp.seed.staff-password=
