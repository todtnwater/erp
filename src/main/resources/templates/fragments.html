<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Smart ERP'">Smart ERP</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --line: #e3e6ea;
            --text: #1d2329;
            --muted: #6b7480;
            --accent: #1f6feb;
            --side: #111827;
            --side-text: #cbd5e1;
            --ok: #1a7f37;
            --okbg: #e7f5ec;
            --warn: #b42318;
            --warnbg: #fdecea;
            --amber: #9a6700;
            --amberbg: #fff4d6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Pretendard", "Noto Sans KR", "Noto Sans JP", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        .app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; min-height: 100vh; }
        .app.chat-closed { grid-template-columns: 220px minmax(0, 1fr) 0; }
        .app.chat-closed .chat { display: none; }
        @media (max-width: 1200px) {
            .app, .app.chat-closed { grid-template-columns: 200px minmax(0, 1fr); }
            .chat { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100vw); z-index: 20; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
        }
        @media (max-width: 760px) {
            .app, .app.chat-closed { grid-template-columns: 1fr; }
            .side { position: static; height: auto; }
            .side nav { display: flex; flex-wrap: wrap; gap: 4px; }
        }

        /* sidebar */
        .side { background: var(--side); color: var(--side-text); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .brand { color: #fff; font-weight: 700; font-size: 16px; padding: 4px 10px 2px; }
        .brand-sub { font-size: 11px; color: #94a3b8; padding: 0 10px 16px; }
        .side .group { font-size: 11px; color: #64748b; padding: 14px 10px 6px; letter-spacing: .04em; }
        .side a { display: block; color: var(--side-text); text-decoration: none; padding: 8px 10px; border-radius: 6px; margin-bottom: 2px; }
        .side a:hover { background: #1f2937; color: #fff; }
        .side a.on { background: var(--accent); color: #fff; }
        .side .status { margin-top: 18px; padding: 0 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
        .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #374151; color: #fff; font-size: 12px; }
        .pill.on { background: #14532d; }
        .pill.off { background: #7f1d1d; }

        /* main */
        .main { padding: 20px 24px; min-width: 0; }
        .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .page-head h1 { margin: 0; font-size: 20px; }
        .page-head .desc { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
        .kpi .label { color: var(--muted); font-size: 12px; }
        .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
        .kpi.alert .value { color: var(--warn); }
        .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
        @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
        .table-wrap { overflow: auto; max-height: 520px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        th { position: sticky; top: 0; background: #fafbfc; font-size: 12px; color: var(--muted); font-weight: 600; z-index: 1; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        tr.low td { background: var(--warnbg); }
        tr.today td { background: #f0f6ff; }
        .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
        .badge.low { background: var(--warn); color: #fff; }
        .badge.ok { background: var(--okbg); color: var(--ok); }
        .badge.IN { background: #dbeafe; color: #1d4ed8; }
        .badge.OUT { background: #ffedd5; color: #9a3412; }
        .badge.AI { background: #ede9fe; color: #5b21b6; }
        .badge.UI { background: #f1f5f9; color: #334155; }
        .badge.st-DONE { background: var(--okbg); color: var(--ok); }
        .badge.st-PLANNED { background: #e0ecff; color: #1d4ed8; }
        .badge.st-PARTIAL { background: var(--amberbg); color: var(--amber); }
        .badge.st-MISSED { background: var(--warn); color: #fff; }
        .badge.reason { background: var(--amberbg); color: var(--amber); }
        .badge.src { background: #f1f5f9; color: #334155; }
        .muted { color: var(--muted); font-size: 12px; font-weight: 400; }
        .usage { display: flex; align-items: center; gap: 12px; }
        .bar { flex: 1; height: 10px; background: #eef1f4; border-radius: 999px; overflow: hidden; }
        .bar > div { height: 100%; background: var(--accent); }
        .bar.hot > div { background: var(--warn); }
        input, select, button { font: inherit; }
        input, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
        button { padding: 7px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
        button.ghost { background: #eef2f7; color: var(--text); }
        button.small { padding: 3px 10px; font-size: 12px; }
        button.danger { background: #fff; color: var(--warn); border: 1px solid #f3b8b3; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .form select[name=productId] { min-width: 220px; }
        .form input[name=qty] { width: 100px; }
        .flash { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
        .flash.ok { background: var(--okbg); color: var(--ok); }
        .flash.err { background: var(--warnbg); color: var(--warn); }
        .rule { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

        /* chat */
        .chat { background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; padding: 14px; }
        .chat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .chat-head h2 { margin: 0; font-size: 15px; }
        .chat-who { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
        .chat-who b { color: var(--text); }
        .me { margin: 18px 10px 0; padding: 12px; border-radius: 8px; background: #1f2937; font-size: 12px; color: #cbd5e1; }
        .me .who { color: #fff; font-size: 14px; font-weight: 700; }
        .me form { margin-top: 8px; }
        .me button { width: 100%; background: #374151; }
        .role-badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-left: 4px; }
        .role-badge.admin { background: #fde68a; color: #92400e; }
        .role-badge.staff { background: #e0ecff; color: #1d4ed8; }
        .chat-log { flex: 1; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcfd; }
        .msg { display: flex; flex-direction: column; margin-bottom: 12px; }
        .msg .bubble { max-width: 94%; padding: 9px 12px; border-radius: 10px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-items: flex-end; }
        .msg.user .bubble { background: var(--accent); color: #fff; }
        .msg.ai .bubble { background: #fff; border: 1px solid var(--line); }
        .msg.sys .bubble { color: var(--muted); font-size: 12px; padding: 2px 0; }
        .meta { max-width: 94%; margin-top: 4px; font-size: 11px; color: var(--muted); word-break: break-all; }
        .approval { max-width: 94%; margin-top: 8px; padding: 12px; border: 1px solid #c7d2fe; border-radius: 10px; background: #eef2ff; }
        .approval.exception { border-color: #f3c46b; background: var(--amberbg); }
        .approval .row { display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
        .approval .delta { font-size: 18px; font-weight: 700; margin: 6px 0; }
        .approval ul { margin: 6px 0; padding-left: 18px; font-size: 12px; }
        .approval .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        .approval.done { background: var(--okbg); border-color: #a7d7b5; }
        .approval.rejected { background: #f3f4f6; border-color: var(--line); color: var(--muted); }
        .chat-table { max-width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
        .chat-table .ttl { padding: 6px 10px; font-size: 12px; font-weight: 700; background: #f6f8fa; border-bottom: 1px solid var(--line); }
        .chat-table .scroll { max-height: 260px; overflow: auto; }
        .chat-table table { font-size: 12px; }
        .chat-table th, .chat-table td { padding: 4px 8px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .chip { padding: 5px 10px; border-radius: 999px; background: #eef2f7; color: var(--text); font-size: 12px; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; }
        .chat-toggle { position: fixed; right: 18px; bottom: 18px; z-index: 30; border-radius: 999px; padding: 10px 16px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    </style>
</head>

<body>

<aside th:fragment="sidebar(active)" class="side">
    <div class="brand">Smart ERP</div>
    <div class="brand-sub">도쿄 청과 냉장센터 · 귤·사과·양파</div>
    <nav>
        <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'on' : ''">📊 대시보드</a>
        <div class="group">기준정보</div>
        <a th:href="@{/products}" th:classappend="${active == 'products'} ? 'on' : ''">📦 상품 마스터</a>
        <div class="group">입출고</div>
        <a th:href="@{/inbound}" th:classappend="${active == 'inbound'} ? 'on' : ''">📥 입고 예정 · 입고 처리</a>
        <a th:href="@{/outbound}" th:classappend="${active == 'outbound'} ? 'on' : ''">📤 출고 처리</a>
        <div class="group">재고</div>
        <a th:href="@{/warehouse}" th:classappend="${active == 'warehouse'} ? 'on' : ''">🗺️ 창고 맵 (실시간)</a>
        <a th:href="@{/stock}" th:classappend="${active == 'stock'} ? 'on' : ''">🏬 재고 현황</a>
        <a th:href="@{/history}" th:classappend="${active == 'history'} ? 'on' : ''">🧾 입출고 이력 (감사 로그)</a>
        <div class="group">분석</div>
        <a th:href="@{/forecast}" th:classappend="${active == 'forecast'} ? 'on' : ''">📈 입하량 예측 (RF)</a>
        <th:block th:if="${loginUser != null and loginUser.admin()}">
            <div class="group">관리</div>
            <a th:href="@{/users}" th:classappend="${active == 'users'} ? 'on' : ''">👤 사용자 관리</a>
        </th:block>
    </nav>
    <div class="me" th:if="${loginUser != null}">
        <div>로그인</div>
        <div class="who"><span th:text="${loginUser.name()}">이름</span>
            <span class="role-badge" th:classappend="${loginUser.admin()} ? 'admin' : 'staff'"
                  th:text="${loginUser.admin()} ? '관리자' : '직원'">직원</span></div>
        <div th:text="${loginUser.loginId()}">id</div>
        <form th:action="@{/logout}" method="post" id="logoutForm" style="display:flex;gap:6px">
            <a th:href="@{/me}" style="flex:1"><button type="button" class="small" style="white-space:nowrap">내 정보</button></a>
            <button type="submit" class="small" style="flex:1;white-space:nowrap">로그아웃</button>
        </form>
    </div>
    <div class="status">
        <span id="pillLlm" class="pill">LLM 확인 중</span>
        <span id="pillVec" class="pill">Vector DB 확인 중</span>
    </div>
</aside>

<div th:fragment="flash">
    <div th:if="${flash}" class="flash ok" th:text="${flash}">완료</div>
    <div th:if="${flashError}" class="flash err" th:text="${flashError}">오류</div>
</div>

<section th:fragment="chat" class="chat" id="chatPanel">
    <div class="chat-head">
        <h2>🤖 AI 업무 도우미</h2>
        <div style="display:flex;gap:6px">
            <button type="button" class="ghost small" id="chatClear" title="대화 기록을 비웁니다 (DB는 그대로)">🗑 대화 지우기</button>
            <button type="button" class="ghost small" id="chatClose">접기</button>
        </div>
    </div>
    <div class="chat-who" id="chatWho"
         th:attr="data-name=${loginUser != null ? loginUser.name() : ''},data-role=${loginUser != null ? loginUser.role() : 'STAFF'},data-login=${loginUser != null ? loginUser.loginId() : ''}">
        <span>요청·승인자</span>
        <b th:text="${loginUser != null ? loginUser.name() : '-'}">이름</b>
        <span class="role-badge" th:classappend="${loginUser != null and loginUser.admin()} ? 'admin' : 'staff'"
              th:text="${loginUser != null and loginUser.admin()} ? '관리자 · 예외 승인 가능' : '직원 · 예외 승인 불가'">직원</span>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chips">
        <button type="button" class="chip" data-q="오늘 입고 예정 보여줘">오늘 입고 예정</button>
        <button type="button" class="chip" data-q="에히메 귤 198상자 입고해줘">에히메 귤 198상자</button>
        <button type="button" class="chip" data-q="와카야마 귤 780상자 입고해줘">와카야마 780상자 (10배)</button>
        <button type="button" class="chip" data-q="아오모리 사과 830kg 입고해줘">아오모리 830kg</button>
        <button type="button" class="chip" data-q="미입고된 거 있어?">미입고 확인</button>
        <button type="button" class="chip" data-q="창고 사용률 알려줘">창고 사용률</button>
        <button type="button" class="chip" data-q="다음 주 귤 시장 입하량 예측 알려줘">귤 입하 예측</button>
        <button type="button" class="chip" data-q="예정보다 많이 들어오면 어떻게 처리해?">예외 입고 절차</button>
    </div>
    <div class="chat-input">
        <input id="chatInput" type="text" maxlength="500" placeholder="예) 에히메 귤 198상자 입고해줘">
        <button id="sendBtn" type="button" disabled>보내기</button>
    </div>
</section>

<th:block th:fragment="scripts">
<button type="button" class="chat-toggle" id="chatOpen" style="display:none">🤖 AI 도우미</button>
<script th:inline="none">
    (() => {
        const app = document.querySelector('.app');
        const log = document.getElementById('chatLog');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const who = document.getElementById('chatWho');
        const ME = {name: who.dataset.name || '', role: who.dataset.role || 'STAFF', login: who.dataset.login || ''};
        const HISTORY_KEY = 'erpChatHistory:' + ME.login;
        const openBtn = document.getElementById('chatOpen');
        let history = [];
        let reasonCodes = {};
        let aiOnline = false;
        let busy = false;

        function store(key, value) {
            try { sessionStorage.setItem(key, value); } catch (e) { }
        }
        function load(key) {
            try { return sessionStorage.getItem(key); } catch (e) { return null; }
        }

        function setChatOpen(open) {
            app.classList.toggle('chat-closed', !open);
            openBtn.style.display = open ? 'none' : 'block';
            store('erpChatOpen', open ? '1' : '0');
        }
        document.getElementById('chatClose').addEventListener('click', () => setChatOpen(false));
        openBtn.addEventListener('click', () => setChatOpen(true));
        setChatOpen(load('erpChatOpen') !== '0');

        /** JSON 대신 HTML(시간 초과·서버 꺼짐 페이지)이 오면 상태 코드로 알려 준다 */
        async function readJson(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                const why = res.status === 524 ? 'AI 응답이 100초를 넘어 Cloudflare가 연결을 끊었습니다. 질문을 짧게 다시 해 주세요.'
                    : (res.status === 502 || res.status === 530) ? 'ERP 서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.'
                    : (res.status === 401 || text.indexOf('login') >= 0) ? '로그인이 풀렸습니다. 새로고침 후 다시 로그인하세요.'
                    : '서버가 예상과 다른 응답을 보냈습니다.';
                return {error: why + ' (HTTP ' + res.status + ')'};
            }
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function actor() {
            return ME.name;
        }

        function scrollDown() {
            log.scrollTop = log.scrollHeight;
        }

        function addMsg(kind, text) {
            const wrap = document.createElement('div');
            wrap.className = 'msg ' + kind;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            wrap.appendChild(bubble);
            log.appendChild(wrap);
            scrollDown();
            return wrap;
        }

        function addMeta(wrap, text) {
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = text;
            wrap.appendChild(meta);
        }

        function reasonSelectHtml() {
            let html = '<select class="reason"><option value="">사유코드 선택</option>';
            Object.keys(reasonCodes).forEach(k => {
                html += '<option value="' + esc(k) + '">' + esc(reasonCodes[k]) + '</option>';
            });
            return html + '</select>';
        }

        function addCard(wrap, c) {
            const typeLabel = c.type === 'IN' ? '입고' : '출고';
            const el = document.createElement('div');
            el.className = 'approval' + (c.exception ? ' exception' : '');
            let warnHtml = '';
            if (c.warnings && c.warnings.length) {
                warnHtml = '<ul>' + c.warnings.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>';
            }
            el.innerHTML =
                '<div class="row"><b>' + (c.exception ? '예외 ' : '') + '승인 요청 · ' + typeLabel + '</b><span class="muted">' + esc(c.expiresAt) + '까지 유효</span></div>' +
                '<div class="row"><span>' + esc(c.productCode) + ' ' + esc(c.productName) + '</span><span>' + esc(c.qty) + esc(c.unit) + ' (' + esc(c.kgTotal) + 'kg)</span></div>' +
                '<div class="delta">' + esc(c.before) + ' → ' + esc(c.after) + ' ' + esc(c.unit) + '</div>' +
                warnHtml +
                (c.exception
                    ? '<div class="muted">예외 입고: 관리자(MANAGER) 권한 + 사유코드가 있어야 반영됩니다.</div>'
                    : '<div class="muted">아직 DB에 반영되지 않았습니다.</div>') +
                '<div class="actions">' + (c.exception ? reasonSelectHtml() : '') +
                '<button type="button" class="approve">승인</button><button type="button" class="danger">거절</button></div>';
            el.querySelector('.approve').addEventListener('click', () => decide(el, c, 'approve'));
            el.querySelector('.danger').addEventListener('click', () => decide(el, c, 'reject'));
            wrap.appendChild(el);
            if (c.decided) {
                markDecided(el, c.decidedKind, c.decided);
            }
            scrollDown();
        }

        /** AI 도구 결과(입출고 이력, 입고 예정)를 DB 값 그대로 표로 그리기 */
        function addTables(wrap, tables) {
            (tables || []).forEach(t => {
                const box = document.createElement('div');
                box.className = 'chat-table';
                let html = '<div class="ttl">' + esc(t.title) + ' · ' + t.rows.length + '건</div><div class="scroll"><table><thead><tr>';
                t.columns.forEach(c => { html += '<th>' + esc(c) + '</th>'; });
                html += '</tr></thead><tbody>';
                t.rows.forEach(r => {
                    html += '<tr>' + r.map(v => '<td' + (typeof v === 'number' ? ' class="num"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>';
                });
                box.innerHTML = html + '</tbody></table></div>';
                wrap.appendChild(box);
            });
            scrollDown();
        }

        /** 처리 끝난 카드 모양으로 바꾸기 (메뉴를 옮겨 다시 그릴 때도 같은 모양 유지) */
        function markDecided(el, kind, message) {
            const oldErr = el.querySelector('.err');
            if (oldErr) {
                oldErr.remove();
            }
            el.classList.remove('exception');
            el.classList.add(kind === 'approve' ? 'done' : 'rejected');
            el.querySelector('.actions').innerHTML = '<span>' + esc(message) + '</span>';
        }

        async function decide(el, c, kind) {
            const id = c.actionId;
            const reasonSel = el.querySelector('select.reason');
            const reasonCode = reasonSel ? reasonSel.value : '';
            el.querySelectorAll('button').forEach(b => b.disabled = true);
            try {
                const res = await fetch('/api/actions/' + encodeURIComponent(id) + '/' + kind, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reasonCode: reasonCode})
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.error || '처리 실패');
                }
                c.decided = data.message;
                c.decidedKind = kind;
                markDecided(el, kind, data.message);
                history.push({role: 'assistant', content: '[시스템] ' + data.message, local: true});
                saveChat();
                refreshMain();
            } catch (e) {
                let err = el.querySelector('.err');
                if (!err) {
                    err = document.createElement('div');
                    err.className = 'err';
                    err.style.color = 'var(--warn)';
                    err.style.marginTop = '6px';
                    el.appendChild(err);
                }
                err.textContent = e.message;
                if (e.message.indexOf('이미 처리') < 0) {
                    el.querySelectorAll('button').forEach(b => b.disabled = false);
                } else {
                    c.decided = '이미 처리됐거나 만료된 요청입니다 (10분 유효). 필요하면 다시 요청하세요.';
                    c.decidedKind = 'reject';
                    markDecided(el, 'reject', c.decided);
                    saveChat();
                }
            }
        }

        /** 승인 후 현재 페이지의 본문만 다시 그린다 (채팅은 유지) */
        async function refreshMain() {
            try {
                const res = await fetch(location.pathname + location.search);
                if (!res.ok) {
                    return;
                }
                const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
                const fresh = doc.getElementById('main');
                if (fresh) {
                    document.getElementById('main').innerHTML = fresh.innerHTML;
                    if (window.erpPageInit) {
                        window.erpPageInit();
                    }
                }
            } catch (e) {
                console.warn(e);
            }
        }
        window.erpRefreshMain = refreshMain;

        function setPill(id, on, label) {
            const el = document.getElementById(id);
            el.className = 'pill ' + (on ? 'on' : 'off');
            el.textContent = label + (on ? ' ● 연결' : ' ● 오프라인');
        }

        async function refreshStatus() {
            try {
                const res = await fetch('/api/status');
                const s = await res.json();
                setPill('pillLlm', s.ollama, 'LLM ' + (s.model || ''));
                setPill('pillVec', s.qdrant && s.manualsReady, 'Vector DB');
                aiOnline = !!s.ollama;
            } catch (e) {
                aiOnline = false;
                setPill('pillLlm', false, 'LLM');
                setPill('pillVec', false, 'Vector DB');
            }
            sendBtn.disabled = !aiOnline || busy;
            input.placeholder = aiOnline
                ? '예) 에히메 귤 198상자 입고해줘'
                : 'AI 서버 오프라인 · ERP 메뉴 기능은 정상 사용 가능';
        }

        async function loadReasonCodes() {
            try {
                const res = await fetch('/api/reason-codes');
                reasonCodes = await res.json();
            } catch (e) {
                reasonCodes = {};
            }
        }

        /** 메뉴를 옮겨 다녀도 대화 내용이 남도록 브라우저 탭 안에 저장 */
        function saveChat() {
            store(HISTORY_KEY, JSON.stringify(history.slice(-20)));
        }

        function restoreChat() {
            try {
                const saved = JSON.parse(load(HISTORY_KEY) || '[]');
                if (Array.isArray(saved) && saved.length) {
                    history = saved;
                    saved.forEach(m => {
                        const wrap = addMsg(m.role === 'user' ? 'user' : 'ai', m.content);
                        addTables(wrap, m.tables);
                        (m.cards || []).forEach(c => addCard(wrap, c));
                    });
                    return true;
                }
            } catch (e) { }
            return false;
        }

        async function send(text) {
            const msg = (text != null ? text : input.value).trim();
            if (!msg || busy || !aiOnline) {
                return;
            }
            input.value = '';
            busy = true;
            sendBtn.disabled = true;
            addMsg('user', msg);
            const answer = addMsg('ai', '확인 중입니다');
            const bubble = answer.querySelector('.bubble');
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, history: history.filter(m => !m.local).slice(-6).map(m => ({role: m.role, content: m.content}))})
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.error || '오류가 발생했습니다.');
                }
                bubble.textContent = data.reply;
                addTables(answer, data.tables);
                (data.pendings || []).forEach(c => addCard(answer, c));
                if (data.sources && data.sources.length) {
                    addMeta(answer, '참고 매뉴얼: ' + data.sources.join(', '));
                }
                if (ME.role === 'MANAGER' && data.toolLog && data.toolLog.length) {
                    const d = document.createElement('details');
                    d.className = 'meta';
                    const sm = document.createElement('summary');
                    sm.textContent = '🔧 처리 근거 (관리자만 보임)';
                    const body = document.createElement('div');
                    body.textContent = data.toolLog.join(' → ');
                    d.appendChild(sm);
                    d.appendChild(body);
                    answer.appendChild(d);
                    scrollDown();
                }
                history.push({role: 'user', content: msg});
                history.push({role: 'assistant', content: data.reply, cards: data.pendings || [], tables: data.tables || []});
                saveChat();
            } catch (e) {
                bubble.textContent = '오류: ' + e.message;
            } finally {
                busy = false;
                sendBtn.disabled = !aiOnline;
                input.focus();
                scrollDown();
            }
        }

        sendBtn.addEventListener('click', () => send());
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.isComposing) {
                e.preventDefault();
                send();
            }
        });
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => send(chip.dataset.q));
        });
        const logoutForm = document.getElementById('logoutForm');
        if (logoutForm) {
            logoutForm.addEventListener('submit', () => {
                try { sessionStorage.removeItem(HISTORY_KEY); } catch (e) { }
            });
        }

        const INTRO = '자연어로 입고 예정 확인, 재고 조회, 입출고 요청, 업무 매뉴얼 검색을 할 수 있습니다. 입고는 예정 대비 검증을 거치고, 승인 버튼을 눌러야 반영됩니다.';
        document.getElementById('chatClear').addEventListener('click', () => {
            if (busy) {
                return;
            }
            history = [];
            saveChat();
            log.innerHTML = '';
            addMsg('sys', INTRO);
            input.focus();
        });

        if (!restoreChat()) {
            addMsg('sys', INTRO);
        }
        loadReasonCodes();
        refreshStatus();
        setInterval(refreshStatus, 15000);
        if (window.erpPageInit) {
            window.erpPageInit();
        }
    })();
</script>
</th:block>

</body>
</html>
