<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: linear-gradient(135deg, #111827 0%, #1f2937 60%, #1f6feb 140%); }
    .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .login-card h1 { margin: 0; font-size: 22px; }
    .login-card .sub { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
    .login-card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    .login-card input { width: 100%; padding: 10px 12px; }
    .login-card button { width: 100%; margin-top: 18px; padding: 11px; font-size: 15px; }
    .login-note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
<div class="login-wrap">
    <form class="login-card" th:action="@{/login}" method="post" autocomplete="on">
        <h1>Smart ERP</h1>
        <div class="sub">도쿄 청과 냉장센터 · 귤 · 사과 · 양파</div>
        <div th:if="${flash}" class="flash ok" th:text="${flash}">완료</div>
        <div th:if="${flashError}" class="flash err" th:text="${flashError}">오류</div>
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" type="text" maxlength="20" required autofocus
               th:value="${loginId}" autocomplete="username">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" maxlength="64" required autocomplete="current-password">
        <button type="submit">로그인</button>
        <div style="text-align:center;margin-top:12px;font-size:13px">
            계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
        </div>
        <div class="login-note">
            · 권한(관리자 / 현장 직원)은 관리자가 부여합니다<br>
            · 현장 직원은 예정 범위 안의 입고만, 관리자는 사유코드를 남겨 예외 입고까지 승인할 수 있습니다
        </div>
    </form>
</div>
<script th:inline="none">
    try {
        Object.keys(sessionStorage).forEach(k => {
            if (k.indexOf('erpChatHistory') === 0) {
                sessionStorage.removeItem(k);
            }
        });
    } catch (e) { }
</script>
</body>
</html>
