<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('창고 맵')}"></head>
<body>
<style>
    .wh-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; }
    @media (max-width: 1100px) { .wh-top { grid-template-columns: 1fr; } }
    .wh-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
    .wh-stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
    .wh-racks { display: flex; flex-direction: column; gap: 6px; }
    .rack-row { display: grid; grid-template-columns: 34px repeat(14, minmax(0, 1fr)); gap: 4px; align-items: center; }
    .rack-label { font-size: 11px; color: var(--muted); text-align: center; }
    .aisle { height: 22px; border-top: 2px dashed #d0d7de; border-bottom: 2px dashed #d0d7de; margin: 4px 0 4px 38px;
        font-size: 11px; color: #9aa4af; display: flex; align-items: center; justify-content: center; letter-spacing: .3em; }
    .slot { position: relative; aspect-ratio: 1 / 1; border-radius: 5px; background: #eef1f4; border: 1px solid #dde2e7;
        overflow: hidden; font-size: 10px; display: flex; align-items: flex-start; justify-content: center; cursor: default; }
    .slot.capzone { background: repeating-linear-gradient(45deg, #f6f7f9, #f6f7f9 4px, #eceff3 4px, #eceff3 8px); }
    .slot.pillar { background: #374151; border-color: #374151; }
    .slot .fill { position: absolute; left: 0; right: 0; bottom: 0; opacity: .9; }
    .slot .tag { position: relative; z-index: 1; margin-top: 3px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .slot.low { box-shadow: inset 0 0 0 2px #b42318; }
    .slot.ghost { border: 2px dashed currentColor; background: transparent; animation: pulse 1s ease-in-out infinite; }
    .slot.ghost .fill { opacity: .35; }
    .slot.over { background: #fdecea; border: 2px solid #b42318; color: #b42318; animation: shake .5s ease-in-out 2; }
    .slot.pop { animation: pop .6s ease-out; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    .overflow-box { margin-top: 12px; padding: 10px; border: 2px dashed #b42318; border-radius: 8px; background: #fff7f6; display: none; }
    .overflow-box .rack-row { grid-template-columns: repeat(14, minmax(0, 1fr)); }
    .legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px;
        border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
    .legend-item:hover { background: #f6f8fa; border-color: var(--line); }
    .dot { width: 14px; height: 14px; border-radius: 4px; }
    .sim-result { margin-top: 12px; padding: 12px; border-radius: 8px; background: #f6f8fa; line-height: 1.6; display: none; }
    .sim-result.ok { background: var(--okbg); }
    .sim-result.warn { background: var(--amberbg); }
    .sim-result.bad { background: var(--warnbg); }
    .verdict { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
</style>
<div class="app">
    <aside th:replace="~{fragments :: sidebar('warehouse')}"></aside>

    <main id="main" class="main">
        <div class="page-head">
            <div>
                <h1>창고 맵 (실시간)</h1>
                <div class="desc">냉장 구역 200㎡ · T11 팔레트 82자리 · 칸 하나 = 팔레트 1장, 색이 찬 높이 = 그 팔레트에 실린 상자 비율</div>
            </div>
            <button type="button" class="ghost" id="whReload">↻ 새로고침</button>
        </div>

        <div class="wh-top">
            <section class="card">
                <div class="wh-stats">
                    <div>사용 <b id="stUsed">-</b> / <span id="stCap">82</span> 팔레트</div>
                    <div>사용률 <b id="stPct">-</b></div>
                    <div>운영 상한 <b id="stCapLine">-</b></div>
                    <div>빈 자리 <b id="stFree">-</b></div>
                </div>
                <div id="whRacks" class="wh-racks"></div>
                <div id="whOverflow" class="overflow-box">
                    <div style="color:#b42318;font-weight:700;margin-bottom:8px" id="whOverflowLabel">창고에 들어갈 자리가 없는 팔레트</div>
                    <div id="whOverflowCells" class="rack-row"></div>
                </div>
                <div class="rule">
                    ▨ 빗금 칸 = 운영 상한(80%)을 넘는 자리 · 빨간 테두리 = 안전재고 미달 상품 · 검은 칸 = 기둥 ·
                    점선 깜빡이는 칸 = 오른쪽 "입고 미리보기"로 새로 들어올 팔레트
                </div>
            </section>

            <div>
                <section class="card">
                    <h2>입고 미리보기 <span class="muted">DB는 바뀌지 않음 · 검증 규칙만 미리 확인</span></h2>
                    <div class="form">
                        <select id="simProduct"></select>
                        <input id="simQty" type="number" min="1" max="100000" placeholder="수량" style="width:100px">
                        <select id="simUnit">
                            <option value="box">상자</option>
                            <option value="kg">kg</option>
                        </select>
                        <button type="button" id="simBtn">미리보기</button>
                    </div>
                    <div class="presets">
                        <button type="button" class="chip sim-preset" data-code="MK-EHM" data-qty="198" data-unit="box">에히메 198상자</button>
                        <button type="button" class="chip sim-preset" data-code="MK-WKY" data-qty="780" data-unit="box">와카야마 780상자 (0 하나 더)</button>
                        <button type="button" class="chip sim-preset" data-code="AP-AOM" data-qty="830" data-unit="kg">아오모리 830kg</button>
                        <button type="button" class="chip sim-preset" data-code="ON-HKD" data-qty="3000" data-unit="box">양파 3000상자 (용량 초과)</button>
                    </div>
                    <div id="simResult" class="sim-result"></div>
                </section>

                <section class="card">
                    <h2>품목 범례 <span class="muted">클릭하면 미리보기에 선택</span></h2>
                    <div id="whLegend" class="legend"></div>
                </section>
            </div>
        </div>
    </main>

    <section th:replace="~{fragments :: chat}"></section>
</div>
<script th:inline="none">
    (() => {
        const COLORS = {'사과': '#e5484d', '귤': '#f59e0b', '양파': '#a0785a'};
        const COLS = 14;
        const ROWS = 6;
        let data = null;
        let lastSig = {};
        let firstRender = true;
        let sim = null;

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function palletsFor(qty, per) {
            return qty <= 0 ? 0 : Math.ceil(qty / per);
        }

        function colorOf(p) {
            return COLORS[p.category] || '#64748b';
        }

        /** 상품별 팔레트를 위치(C1 사과 → C2 귤 → C3 양파) 순서로 자리에 배치 */
        function buildSlots(products) {
            const slots = [];
            products.slice().sort((a, b) => String(a.location).localeCompare(String(b.location)))
                .forEach(p => {
                    const per = p.boxesPerPallet;
                    const full = Math.floor(p.stockQty / per);
                    const rest = p.stockQty % per;
                    for (let i = 0; i < full; i++) {
                        slots.push({p: p, boxes: per});
                    }
                    if (rest > 0) {
                        slots.push({p: p, boxes: rest});
                    }
                });
            return slots;
        }

        function slotHtml(idx, slot, extraClass, title) {
            const p = slot.p;
            const pct = Math.round(slot.boxes * 100 / p.boxesPerPallet);
            const short = String(p.code).split('-')[1] || p.code;
            return '<div class="slot ' + extraClass + (p.low ? ' low' : '') + '" style="color:' + colorOf(p) + '" title="' + esc(title) + '">' +
                '<div class="fill" style="height:' + pct + '%;background:' + colorOf(p) + '"></div>' +
                '<span class="tag"' + (pct < 55 || extraClass === 'ghost' ? ' style="color:#374151;text-shadow:none"' : '') + '>'
                + esc(short) + '</span></div>';
        }

        function render() {
            if (!data || !document.getElementById('whRacks')) {
                return;
            }
            const cap = data.capacity;
            const capLine = Math.floor(cap * data.operatingCap);
            const slots = buildSlots(data.products);
            const used = slots.length;

            let ghosts = [];
            if (sim && sim.delta > 0) {
                for (let i = 0; i < sim.delta; i++) {
                    ghosts.push({p: sim.p, boxes: sim.p.boxesPerPallet});
                }
            }

            document.getElementById('stUsed').textContent = used + (sim && sim.delta > 0 ? ' → ' + (used + sim.delta) : '');
            document.getElementById('stCap').textContent = cap;
            document.getElementById('stPct').textContent = Math.round(used * 100 / cap) + '%'
                + (sim && sim.delta > 0 ? ' → ' + Math.round((used + sim.delta) * 100 / cap) + '%' : '');
            document.getElementById('stCapLine').textContent = capLine + '자리';
            document.getElementById('stFree').textContent = Math.max(cap - used, 0);

            let html = '';
            let idx = 0;
            const newSig = {};
            for (let r = 0; r < ROWS; r++) {
                if (r === 2 || r === 4) {
                    html += '<div class="aisle">통 로 · 지 게 차</div>';
                }
                html += '<div class="rack-row"><div class="rack-label">R' + (r + 1) + '</div>';
                for (let c = 0; c < COLS; c++) {
                    const cell = r * COLS + c;
                    if (cell >= cap) {
                        html += '<div class="slot pillar" title="기둥 / 사용 불가"></div>';
                        continue;
                    }
                    const zone = cell >= capLine ? ' capzone' : '';
                    if (idx < used) {
                        const s = slots[idx];
                        const sig = s.p.code + ':' + s.boxes;
                        newSig[cell] = sig;
                        const pop = !firstRender && lastSig[cell] !== sig ? ' pop' : '';
                        html += slotHtml(cell, s, pop,
                            'R' + (r + 1) + '-' + (c + 1) + ' · ' + s.p.code + ' ' + s.p.name + ' · ' + s.boxes + '/' + s.p.boxesPerPallet + '상자');
                    } else if (idx - used < ghosts.length) {
                        const g = ghosts[idx - used];
                        html += slotHtml(cell, g, 'ghost', '입고 예정 팔레트 (미리보기) · ' + g.p.code);
                    } else {
                        html += '<div class="slot' + zone + '" title="R' + (r + 1) + '-' + (c + 1) + ' 빈 자리' + (zone ? ' (운영 상한 초과 구역)' : '') + '"></div>';
                    }
                    idx++;
                }
                html += '</div>';
            }
            document.getElementById('whRacks').innerHTML = html;
            lastSig = newSig;
            firstRender = false;

            const overflow = Math.max(used + ghosts.length - cap, 0);
            const box = document.getElementById('whOverflow');
            if (overflow > 0) {
                box.style.display = 'block';
                document.getElementById('whOverflowLabel').textContent =
                    '창고에 들어갈 자리가 없는 팔레트 ' + overflow + '장 → 입고 차단 (누구도 승인 불가)';
                let o = '';
                for (let i = 0; i < Math.min(overflow, 56); i++) {
                    o += '<div class="slot over" title="자리 없음"><span class="tag" style="color:#b42318;text-shadow:none">✕</span></div>';
                }
                if (overflow > 56) {
                    o += '<div class="muted" style="grid-column: span 14">… 외 ' + (overflow - 56) + '장</div>';
                }
                document.getElementById('whOverflowCells').innerHTML = o;
            } else {
                box.style.display = 'none';
            }

            renderLegend();
        }

        function renderLegend() {
            const legend = document.getElementById('whLegend');
            const select = document.getElementById('simProduct');
            const keep = select.value;
            legend.innerHTML = data.products.map(p =>
                '<div class="legend-item" data-code="' + esc(p.code) + '">' +
                '<span class="dot" style="background:' + colorOf(p) + '"></span>' +
                '<span>' + esc(p.code) + ' ' + esc(p.name) + (p.low ? ' <span class="badge low">부족</span>' : '') + '</span>' +
                '<span class="muted">' + p.stockQty + '상자 · ' + p.pallets + '팔레트</span></div>'
            ).join('');
            select.innerHTML = data.products.map(p =>
                '<option value="' + esc(p.code) + '">' + esc(p.code) + ' ' + esc(p.name) + '</option>').join('');
            if (keep) {
                select.value = keep;
            }
        }

        function simulate() {
            const code = document.getElementById('simProduct').value;
            const raw = Number(document.getElementById('simQty').value);
            const unit = document.getElementById('simUnit').value;
            const out = document.getElementById('simResult');
            const p = data.products.find(x => x.code === code);
            if (!p || !raw || raw <= 0) {
                out.style.display = 'block';
                out.className = 'sim-result';
                out.innerHTML = '상품과 수량을 입력하세요.';
                return;
            }
            const qty = unit === 'kg' ? Math.round(raw / p.kgPerBox) : Math.round(raw);
            const lines = [];
            if (unit === 'kg') {
                lines.push('단위 환산: ' + raw + 'kg ÷ ' + p.kgPerBox + 'kg/상자 = <b>' + qty + '상자</b>');
            }

            const delta = palletsFor(p.stockQty + qty, p.boxesPerPallet) - palletsFor(p.stockQty, p.boxesPerPallet);
            const used = buildSlots(data.products).length;
            const after = used + delta;
            const capLine = data.capacity * data.operatingCap;

            const plan = (data.todayPlans || []).find(x => x.productCode === p.code);
            let level = 'ok';
            let verdict = '✅ 정상 범위 → 현장 직원이 바로 처리';
            if (!plan) {
                level = 'warn';
                verdict = '⛔ 오늘 입고 예정 없음 → 예외 입고 (관리자 + 사유코드)';
                lines.push('오늘 이 상품의 입고 예정이 등록돼 있지 않습니다.');
            } else {
                const rem = plan.remaining;
                const upper = Math.floor(rem * (1 + data.tolerance));
                const lower = Math.ceil(rem * (1 - data.tolerance));
                lines.push('오늘 예정 ' + plan.plannedQty + '상자 · 입고 ' + plan.receivedQty + ' · 잔량 <b>' + rem + '상자</b> (허용 ' + lower + '~' + upper + ')');
                if (rem === 0) {
                    level = 'warn';
                    verdict = '⛔ 오늘 예정분 이미 입고 완료 → 예외 입고 (관리자 + 사유코드)';
                } else if (qty > upper) {
                    level = 'warn';
                    verdict = '⛔ 예정 대비 ' + (qty / rem).toFixed(1) + '배 → 예외 입고 (관리자 + 사유코드)';
                } else if (qty < lower) {
                    level = 'warn';
                    verdict = '⚠️ 부분 입고 → 처리 가능, ' + (rem - qty) + '상자는 미입고로 남음';
                }
            }
            lines.push('팔레트 ' + (delta > 0 ? '+' + delta + '장' : '추가 없음 (기존 팔레트에 적재)') + ' → 창고 ' + after + '/' + data.capacity
                + ' (' + Math.round(after * 100 / data.capacity) + '%)');
            if (after > data.capacity) {
                level = 'bad';
                verdict = '🚫 창고 용량 초과 → 승인 불가 (관리자도 불가)';
            } else if (after > capLine) {
                lines.push('운영 상한 ' + Math.round(data.operatingCap * 100) + '% 초과 — 출고 일정 확인 필요');
                if (level === 'ok') {
                    level = 'warn';
                }
            }

            sim = {p: p, delta: delta, qty: qty};
            out.style.display = 'block';
            out.className = 'sim-result ' + level;
            out.innerHTML = '<div class="verdict">' + verdict + '</div>' + lines.map(l => '· ' + l).join('<br>') +
                '<div style="margin-top:8px"><button type="button" class="small" id="simAsk">AI 도우미에게 이대로 요청하기</button> ' +
                '<button type="button" class="small ghost" id="simClear">미리보기 지우기</button></div>';
            render();
        }

        async function load() {
            try {
                const res = await fetch('/api/warehouse-map');
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                data = await res.json();
                if (sim && !document.querySelector('#simResult[style*="block"]')) {
                    sim = null;
                }
                if (sim) {
                    const fresh = data.products.find(x => x.code === sim.p.code);
                    if (fresh) {
                        sim.p = fresh;
                        sim.delta = palletsFor(fresh.stockQty + sim.qty, fresh.boxesPerPallet) - palletsFor(fresh.stockQty, fresh.boxesPerPallet);
                    }
                }
                render();
            } catch (e) {
                const racks = document.getElementById('whRacks');
                if (racks) {
                    racks.innerHTML = '<div class="muted">창고 데이터를 불러오지 못했습니다: ' + esc(e.message) + '</div>';
                }
            }
        }

        document.addEventListener('click', e => {
            if (e.target.closest('#whReload')) {
                load();
                return;
            }
            if (e.target.closest('#simBtn')) {
                simulate();
                return;
            }
            const preset = e.target.closest('.sim-preset');
            if (preset) {
                document.getElementById('simProduct').value = preset.dataset.code;
                document.getElementById('simQty').value = preset.dataset.qty;
                document.getElementById('simUnit').value = preset.dataset.unit;
                simulate();
                return;
            }
            const item = e.target.closest('.legend-item');
            if (item) {
                document.getElementById('simProduct').value = item.dataset.code;
                document.getElementById('simQty').focus();
                return;
            }
            if (e.target.closest('#simClear')) {
                sim = null;
                document.getElementById('simResult').style.display = 'none';
                render();
                return;
            }
            if (e.target.closest('#simAsk') && sim) {
                const unit = document.getElementById('simUnit').value;
                const raw = document.getElementById('simQty').value;
                const input = document.getElementById('chatInput');
                const app = document.querySelector('.app');
                if (app.classList.contains('chat-closed')) {
                    document.getElementById('chatOpen').click();
                }
                input.value = sim.p.name + ' ' + raw + (unit === 'kg' ? 'kg' : '상자') + ' 입고해줘';
                input.focus();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.target && e.target.id === 'simQty' && e.key === 'Enter') {
                e.preventDefault();
                simulate();
            }
        });

        /** 채팅에서 승인하면 공통 스크립트가 본문을 갈아끼우고 이 함수를 다시 부름 → 새 팔레트가 튀어나오는 애니메이션 */
        window.erpPageInit = () => {
            load();
        };
        setInterval(() => {
            if (document.getElementById('whRacks')) {
                load();
            }
        }, 20000);
    })();
</script>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
